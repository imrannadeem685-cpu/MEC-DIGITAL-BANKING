name: Build and publish MEC Flutter suite

on:
  push:
    branches:
      - flutter-pages-deploy
    paths:
      - "flutter_suite/**"
      - ".github/workflows/flutter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android and Web platforms
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/mec_flutter_suite"
          flutter create --org com.mecgroup --project-name mec_flutter_suite --platforms=android,web "$APP_DIR"
          cp flutter_suite/pubspec.yaml "$APP_DIR/pubspec.yaml"
          cp flutter_suite/analysis_options.yaml "$APP_DIR/analysis_options.yaml"
          rm -rf "$APP_DIR/lib"
          cp -R flutter_suite/lib "$APP_DIR/lib"
          rm -rf "$APP_DIR/test"
          mkdir -p "$APP_DIR/test"
          cp -R flutter_suite/test/. "$APP_DIR/test/"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Resolve dependencies, analyze and test
        run: |
          cd "$APP_DIR"
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build seven Web launchers and Android APKs
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/docs/flutter"
          mkdir -p "$ROOT/apps" "$ROOT/downloads"

          build_target() {
            local id="$1"
            local base="$2"
            local web_out="$3"
            local apk_name="$4"

            echo "Building $id"
            cd "$APP_DIR"
            flutter build web --release --base-href "$base" --dart-define=PROJECT_ID="$id" --output "$web_out"
            flutter build apk --release --dart-define=PROJECT_ID="$id"
            cp build/app/outputs/flutter-apk/app-release.apk "$ROOT/downloads/$apk_name"
          }

          build_target "mec_hub" "/MEC-DIGITAL-BANKING/flutter/" "$ROOT" "MEC-Workspaces-Hub.apk"

          for id in email_marketing mec_detail_banking mec_group mec_notification_center mec_owner_control prime_trade; do
            build_target "$id" "/MEC-DIGITAL-BANKING/flutter/apps/$id/" "$ROOT/apps/$id" "MEC-$id.apk"
          done

          cat > "$ROOT/downloads/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>MEC Flutter Android Downloads</title>
            <style>
              body{font-family:system-ui,Segoe UI,sans-serif;background:#0b1830;color:#f8f4eb;margin:0;padding:32px}
              main{max-width:760px;margin:auto}h1{color:#e6c995}p{color:#c1ccda;line-height:1.6}
              a{display:block;padding:15px 18px;margin:10px 0;border:1px solid #53657c;border-radius:10px;color:#fff;text-decoration:none;background:#142943}
              a:hover{border-color:#e6c995}small{color:#aab8c8}
            </style>
          </head>
          <body><main><h1>MEC Flutter Android Apps</h1>
          <p>Release APK files generated by the Flutter build workflow. Install only on devices you trust. Existing secure Hatchable sign-in remains required.</p>
          <a href="MEC-Workspaces-Hub.apk">MEC Workspaces Hub APK</a>
          <a href="MEC-email_marketing.apk">Email Marketing APK</a>
          <a href="MEC-mec_detail_banking.apk">MEC Detail Banking APK</a>
          <a href="MEC-mec_group.apk">MEC Group APK</a>
          <a href="MEC-mec_notification_center.apk">MEC Notification Center APK</a>
          <a href="MEC-mec_owner_control.apk">MEC Owner Control Center APK</a>
          <a href="MEC-prime_trade.apk">PRIME TRADE APK</a>
          <p><small>Phase 1 Flutter companion: Android opens the existing secure service in an embedded WebView; this is not a complete native screen rewrite.</small></p>
          <a href="../">← Back to MEC Flutter Hub</a>
          </main></body></html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Flutter suite and existing portal
        id: deployment
        uses: actions/deploy-pages@v4
